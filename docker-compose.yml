services:
  web-server:
    build: .
    container_name: nuvem-local-nginx
    ports:
      - "8080:80"
    restart: always

  database:
    image: postgres:15-alpine
    container_name: nuvem-local-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: meubanco
    ports:
      - "5432:5432"
    restart: always
